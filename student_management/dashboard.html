<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Student Dashboard</h2>
    <div class="row mt-4">
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5>Total Students</h5>
                    <span class="badge bg-primary">500</span>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5>Present Students</h5>
                    <span class="badge bg-success">450</span>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5>Absent Students</h5>
                    <span class="badge bg-danger">50</span>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5>Placements</h5>
                    <span class="badge bg-warning">300</span>
                </div>
            </div>
        </div>
    </div>
    <div class="mt-4">
        <input type="text" class="form-control" placeholder="Search Student">
    </div>
    <div class="table-responsive mt-4">
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>Roll No</th>
                    <th>Name</th>
                    <th>Branch</th>
                    <th>Attendance</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>101</td>
                    <td>Rahul</td>
                    <td>CSE</td>
                    <td>90%</td>
                </tr>
                <tr>
                    <td>102</td>
                    <td>Priya</td>
                    <td>ECE</td>
                    <td>95%</td>
                </tr>
                <tr>
                    <td>103</td>
                    <td>Arjun</td>
                    <td>EEE</td>
                    <td>88%</td>
                </tr>
                <tr>
                    <td>104</td>
                    <td>Sneha</td>
                    <td>IT</td>
                    <td>92%</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
