<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5">
<h2 class="text-center mb-4">Course Registration Form</h2>
<form onsubmit="showAlert(event)">
<div class="mb-3">
<label class="form-label">Student Name</label>
<input type="text" class="form-control" required>
</div>
<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" class="form-control" required>
</div>
<div class="mb-3">
<label class="form-label">Mobile Number</label>
<input type="tel" class="form-control" required>
</div>
<div class="mb-3">
<label class="form-label">Gender</label><br>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
<input type="radio" name="gender"> Other
</div>
<div class="mb-3">
<label class="form-label">Course Selection</label>
<select class="form-select">
<option>Web Development</option>
<option>Python Programming</option>
<option>Data Science</option>
<option>AI & ML</option>
<option>Java Programming</option>
<option>Cloud Computing</option>
</select>
</div>
<div class="mb-3">
<label class="form-label">Qualification</label>
<input type="text" class="form-control">
</div>
<div class="mb-3">
<label class="form-label">Address</label>
<textarea class="form-control"></textarea>
</div>
<div class="mb-3">
<label class="form-label">Upload Resume</label>
<input type="file" class="form-control">
</div>
<div class="form-check mb-3">
<input class="form-check-input" type="checkbox" required>
<label class="form-check-label">Accept Terms & Conditions</label>
</div>
<button class="btn btn-success">Submit</button>
</form>
<div id="successAlert" class="alert alert-success mt-3 d-none">
Registration Submitted Successfully!
</div>
</div>
<script>
function showAlert(event){
event.preventDefault();
document.getElementById("successAlert").classList.remove("d-none");
}
</script>

</body>
</html>
